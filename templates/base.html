<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wright Portfolio</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- MDBootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Portfolio.css') }}">
    
    {% block css %} {% endblock%}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <div>
                {% include "navbar.html" %}
            </div>
           

            <main role="main" class="col-md-9 ms-sm-auto col-lg-10 pt-3 px-4">

                <img src="{{ url_for('static', filename='images/Banner.png') }}" alt="Profile Avatar Image" class="img-fluid ">
                


                <div class="container text-center mt-5" id="about">
                    <h2>Kerene Wright</h2>
                    <p>I'm <span class="typed"></span></p>
                </div>
            </main>
        </div>
    </div>

    <footer>
        <div class="container">
            {% include "footer.html" %}
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/Portfolio.js') }}"></script>
    {% block js %} {% endblock%}
    
</body>
</html>
